openapi: 3.0.3
info:
  title: Inventory Service
  version: 1.0.0
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Health and database check
      responses:
        '200': { description: Service and database are up }
        '503': { description: Database unavailable }
  /api/v1/inventory/{ticketTypeId}:
    get:
      summary: Get ticket availability
      parameters:
        - in: path
          name: ticketTypeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Capacity and current availability }
        '404': { description: Ticket inventory not found }
  /api/v1/reservations:
    post:
      summary: Reserve tickets atomically
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 100 }
        - in: header
          name: X-Correlation-Id
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, event_id, ticket_type_id, quantity]
              properties:
                booking_id: { type: string, maxLength: 64 }
                event_id: { type: string, format: uuid }
                ticket_type_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201': { description: New reservation created }
        '200': { description: Original stored response replayed }
        '400': { description: Request validation failure or missing Idempotency-Key }
        '404': { description: Ticket type not found for event }
        '409': { description: Insufficient inventory or idempotency/booking conflict }
  /api/v1/reservations/{reservationId}:
    get:
      summary: Get reservation state
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Reservation state }
        '404': { description: Reservation not found }
  /api/v1/reservations/{reservationId}/confirm:
    post:
      summary: Confirm reservation after payment success
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Confirmed reservation }
        '409': { description: Reservation was released }
  /api/v1/reservations/{reservationId}/release:
    post:
      summary: Release reservation after payment failure
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Released reservation, repeat-safe }
        '409': { description: Reservation already confirmed }
